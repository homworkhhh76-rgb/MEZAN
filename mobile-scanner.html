<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#087f89">
<meta name="description" content="قارئ باركود الميزان بالكاميرا أو صورة من الجهاز">
<title>قارئ باركود الميزان</title>
<link rel="manifest" href="scanner-manifest.webmanifest?v=7844">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{font-family:"Cairo",Tahoma,Arial,sans-serif;color:#17202b;background:#eef3f6;--primary:#087f89;--primary2:#079aa7;--border:#d8e2e8;--muted:#6c7887;--card:#fff;--ok:#159447;--danger:#c13a3a;--shadow:0 7px 22px rgba(20,40,55,.075)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Cairo",Tahoma,Arial,sans-serif}body{min-height:100vh;background:radial-gradient(circle at 80% -5%,rgba(7,154,167,.12),transparent 34%),linear-gradient(180deg,#f9fbfc 0,#eef3f6 100%);padding:env(safe-area-inset-top) 10px calc(12px + env(safe-area-inset-bottom))}
button,input{font:inherit}.app{width:min(680px,100%);margin:auto}.topbar{display:flex;align-items:center;gap:10px;padding:7px 3px 12px}.brand-logo{width:43px;height:43px;border:1px solid var(--border);border-radius:12px;background:#fff;padding:5px;object-fit:contain;box-shadow:0 4px 12px rgba(20,40,55,.05)}.topbar h1{margin:0;font-size:17px;line-height:1.35}.card{background:var(--card);border:1px solid var(--border);border-radius:15px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.link-card{padding:11px}.link-row{display:grid;grid-template-columns:minmax(150px,220px) auto auto;gap:8px;align-items:end}.link-field span{display:block;font-size:10px;color:var(--muted);margin-bottom:5px}.code{width:100%;height:44px;border:1px solid #cbd9df;border-radius:10px;background:#fbfcfd;outline:0;text-align:center;direction:ltr;font-size:20px;font-weight:800;letter-spacing:7px;padding-left:7px}.code:focus{border-color:var(--primary2);box-shadow:0 0 0 3px rgba(7,154,167,.10)}
.scanner-link-status{min-height:38px;display:flex;align-items:center;gap:9px;border-top:1px solid #edf1f4;margin-top:10px;padding-top:9px;color:#465567}.scanner-link-status:before{content:"";width:9px;height:9px;border-radius:50%;background:#9aa6b2;box-shadow:0 0 0 4px rgba(154,166,178,.12)}.scanner-link-status.connecting:before{background:#d99011}.scanner-link-status.connected:before{background:var(--ok);box-shadow:0 0 0 4px rgba(21,148,71,.12)}.scanner-link-status.error:before{background:var(--danger);box-shadow:0 0 0 4px rgba(193,58,58,.12)}.scanner-link-status b{font-size:11px}
.btn{min-height:42px;border:0;border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;transition:.16s ease;display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.48;cursor:not-allowed}.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 5px 14px rgba(7,154,167,.18)}.btn-secondary{background:#fff;color:#334155;border:1px solid var(--border)}.btn-danger{background:#fff;color:#b42318;border:1px solid #efcdca}
.viewer{position:relative;display:grid;place-items:center;background:#111827;min-height:365px;overflow:hidden}.viewer video{display:block;width:100%;height:min(65vh,590px);min-height:365px;object-fit:cover;background:#111827}.camera-overlay{position:absolute;inset:0;pointer-events:none}.camera-overlay:before{content:"";position:absolute;left:10%;right:10%;top:30%;bottom:30%;border:2px solid rgba(255,255,255,.94);border-radius:18px;box-shadow:0 0 0 999px rgba(1,8,17,.24)}.corner{position:absolute;width:35px;height:35px;border-color:#25d6df;border-style:solid;z-index:2}.c1{top:29%;right:9%;border-width:3px 3px 0 0;border-radius:0 12px 0 0}.c2{top:29%;left:9%;border-width:3px 0 0 3px;border-radius:12px 0 0 0}.c3{bottom:29%;right:9%;border-width:0 3px 3px 0;border-radius:0 0 12px 0}.c4{bottom:29%;left:9%;border-width:0 0 3px 3px;border-radius:0 0 0 12px}.scan-line{position:absolute;z-index:3;left:14%;right:14%;top:50%;height:2px;border-radius:2px;background:#28e1e8;box-shadow:0 0 14px #28e1e8;animation:scan 1.65s ease-in-out infinite alternate}@keyframes scan{from{transform:translateY(-72px)}to{transform:translateY(72px)}}.scan-hint{position:absolute;z-index:4;left:50%;bottom:15px;transform:translateX(-50%);background:rgba(15,23,42,.72);backdrop-filter:blur(7px);color:#fff;padding:7px 11px;border-radius:999px;font-size:10px;white-space:nowrap}
.camera-controls{display:grid;grid-template-columns:1.35fr 1.15fr 1fr 1fr;gap:8px;padding:10px;background:#fff;border-top:1px solid var(--border)}#torchBtn.active{background:#fff6cf;border-color:#eed66c;color:#7a5b00}.image-btn{background:#f5fbfb;color:#08747d;border:1px solid #cde4e7}
.scan-result{position:fixed;left:10px;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;max-width:640px;margin:auto;background:#fff;border:1px solid var(--border);border-radius:13px;padding:10px 12px;box-shadow:0 16px 44px rgba(0,0,0,.19)}.scan-result b,.scan-result small{display:block}.scan-result b{font-size:12px}.scan-result small{font-size:10px;color:var(--muted);margin-top:2px}.scan-result.ok{border-color:#91d5aa}.scan-result.bad{border-color:#efaaa5}
@media(max-width:560px){body{padding-inline:8px}.brand-logo{width:40px;height:40px}.topbar h1{font-size:16px}.link-row{grid-template-columns:1fr 1fr}.link-field{grid-column:1/-1}.viewer,.viewer video{min-height:350px;height:61vh}.camera-controls{grid-template-columns:1fr 1fr}.camera-controls #startScannerBtn{grid-column:1/-1}.card{border-radius:14px}}
</style>
</head>
<body>
<main class="app">
  <header class="topbar"><img class="brand-logo" src="brand-logo.png?v=7844" alt=""><h1>قارئ باركود الميزان</h1></header>

  <section class="card link-card">
    <div class="link-row">
      <label class="link-field"><span>كود الكاشير</span><input id="pairCode" class="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000"></label>
      <button id="connectBtn" class="btn btn-primary">اتصال</button>
      <button id="disconnectBtn" class="btn btn-danger" hidden>قطع</button>
    </div>
    <div id="linkStatus" class="scanner-link-status"><b id="linkStatusText">اكتب كود الكاشير</b></div>
  </section>

  <section class="card">
    <div class="viewer">
      <video id="scannerVideo" playsinline muted></video>
      <div class="camera-overlay"><i class="corner c1"></i><i class="corner c2"></i><i class="corner c3"></i><i class="corner c4"></i><span class="scan-line"></span></div>
      <span class="scan-hint">ضع الباركود داخل الإطار</span>
    </div>
    <div class="camera-controls">
      <button id="startScannerBtn" class="btn btn-primary">تشغيل الكاميرا</button>
      <button id="imageBarcodeBtn" class="btn image-btn">اختيار صورة</button>
      <button id="stopScannerBtn" class="btn btn-secondary" hidden>إيقاف</button>
      <button id="torchBtn" class="btn btn-secondary" hidden>الفلاش</button>
    </div>
    <input id="barcodeImageInput" type="file" accept="image/*" hidden>
  </section>
</main>
<audio id="barcodeSound" src="barcode-scan.mp3?v=7844" preload="auto"></audio>
<div id="scanResult" class="scan-result" hidden></div>
<script src="phone-scanner-v7843.js?v=7844"></script>
<script>if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./service-worker.js?v=7844',{updateViaCache:'none'}).catch(()=>{});</script>
</body>
</html>
