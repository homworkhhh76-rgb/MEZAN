<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>طباعة الفاتورة</title>
<style>
@page{margin:0}
*{box-sizing:border-box}
:root{--paper-width:80mm;--side-gutter:2mm;--print-offset-x:0mm}
html,body{margin:0;padding:0;background:#eef1f4;color:#000;min-height:100%;font-family:Arial,Tahoma,sans-serif}
/* المعاينة والطباعة تستخدمان نفس عرض الورق. المحتوى يأخذ عرض الورقة ناقص هامش متساوٍ يميناً ويساراً. */
.print-stage{width:100%;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:12px;direction:ltr}
.paper{position:relative;flex:0 0 var(--paper-width);width:var(--paper-width);max-width:var(--paper-width);min-height:30mm;margin:0 auto;background:#fff;overflow:hidden;box-shadow:0 8px 34px rgba(0,0,0,.16);direction:ltr}
.receipt{position:relative;width:100%;max-width:100%;margin:0;padding:5mm var(--side-gutter);font-size:13px;line-height:1.4;direction:rtl;background:#fff;color:#000;font-weight:700;transform:translateX(var(--print-offset-x));transform-origin:center top}
.receipt.size-80{--side-gutter:2mm}.receipt.size-58{--side-gutter:2mm;font-size:11px;padding-top:3mm;padding-bottom:3mm}.receipt.size-a4{--side-gutter:10mm;padding-top:10mm;padding-bottom:10mm;font-size:14px}
table{width:100%;border-collapse:collapse}td,th{padding:3px}.r{text-align:right}.l{text-align:left}
.receipt-logo{text-align:center;margin:0 0 6px}.receipt-logo img{display:block;margin:0 auto;object-fit:contain}.receipt-logo-small img{max-width:28mm;max-height:18mm}.receipt-logo-medium img{max-width:36mm;max-height:24mm}.receipt-logo-large img{max-width:46mm;max-height:31mm}
.receipt-header-table{font-weight:700;margin-bottom:8px}.receipt-header-table td{vertical-align:top}
.receipt-bordered th,.receipt-bordered td{border:1.5px solid #000;text-align:center;font-weight:700}
.receipt-totals{margin-top:5px;font-weight:700;font-size:13px}.size-58 .receipt-totals{font-size:11px}
.receipt-net{margin-top:8px}.receipt-net td{padding:8px 4px;font-size:20px;font-weight:800}.receipt-net td:last-child{font-size:22px}.size-58 .receipt-net td{font-size:15px}.size-58 .receipt-net td:last-child{font-size:17px}
.receipt-barcode{text-align:center;margin:8px auto 2px;overflow:hidden}.receipt-barcode svg{max-width:100%;height:auto}.receipt-barcode-small{max-width:65%}.receipt-barcode-medium{max-width:82%}.receipt-barcode-large{max-width:100%}
.receipt-footer-text{text-align:center;font-weight:700;font-size:15px;margin:10px 0;white-space:pre-wrap}.size-58 .receipt-footer-text{font-size:12px}
.receipt-footer-info{font-size:12px;direction:ltr;margin-top:5px;font-weight:700}.size-58 .receipt-footer-info{font-size:10px}
.print-fallback{display:none;text-align:center;padding:14px;font-family:Tahoma,Arial,sans-serif;direction:rtl}.print-fallback button{padding:10px 18px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:15px}
@media(max-width:420px){.print-stage{padding:4px;overflow-x:auto}.paper{margin-left:auto;margin-right:auto}}
@media print{
  html,body{width:var(--paper-width)!important;min-width:var(--paper-width)!important;max-width:var(--paper-width)!important;height:auto!important;min-height:0!important;margin:0!important;padding:0!important;background:#fff!important;overflow:hidden!important}
  .print-stage{display:block!important;width:var(--paper-width)!important;min-width:var(--paper-width)!important;max-width:var(--paper-width)!important;min-height:0!important;margin:0!important;padding:0!important;background:#fff!important;direction:ltr!important}
  .paper{display:block!important;position:relative!important;width:var(--paper-width)!important;min-width:var(--paper-width)!important;max-width:var(--paper-width)!important;margin:0!important;padding:0!important;box-shadow:none!important;background:#fff!important;overflow:hidden!important;direction:ltr!important}
  .receipt{display:block!important;position:relative!important;width:100%!important;min-width:100%!important;max-width:100%!important;margin:0!important;transform:translateX(var(--print-offset-x))!important;direction:rtl!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .print-fallback{display:none!important}
}
</style>
</head>
<body>
<section class="print-stage" id="printStage">
  <div id="paper" class="paper"><main id="receipt" class="receipt size-80"></main></div>
</section>
<div id="fallback" class="print-fallback"><p>تم تجهيز الفاتورة.</p><button onclick="window.print()">فتح الطباعة مرة أخرى</button></div>
<script>
(()=>{
  const p=new URLSearchParams(location.search),token=p.get('token')||'',key='almezan_print_job_v758_'+token;
  let job=null;try{job=JSON.parse(localStorage.getItem(key)||'null')}catch(_){}
  const root=document.getElementById('receipt'),paperEl=document.getElementById('paper');
  if(!job){root.innerHTML='<p style="text-align:center;padding:20px">تعذر العثور على بيانات الفاتورة.</p>';return}
  const mode=job.size==='58'?'58':job.size==='a4'?'a4':'80';
  const paper=mode==='58'?'58mm':mode==='80'?'80mm':'210mm';
  const content=paper;
  let offset=Number(job.offsetMm);if(!Number.isFinite(offset))offset=0;offset=Math.max(-3,Math.min(3,offset));
  document.documentElement.style.setProperty('--paper-width',paper);
    document.documentElement.style.setProperty('--print-offset-x',`${offset}mm`);
  paperEl.style.width=paper;root.style.width='100%';
  const pageStyle=document.createElement('style');
  pageStyle.textContent=`@page{size:${mode==='a4'?'A4 portrait':paper+' auto'};margin:0!important}`;
  document.head.appendChild(pageStyle);
  root.className='receipt size-'+mode;root.innerHTML=job.html||'';document.title=job.number?('فاتورة '+job.number):'طباعة الفاتورة';
  let fired=false;
  const fire=()=>{if(fired)return;fired=true;requestAnimationFrame(()=>requestAnimationFrame(()=>setTimeout(()=>{try{window.print()}catch(_){}},180)))};
  const imgs=[...document.images];if(imgs.length)Promise.allSettled(imgs.map(img=>img.complete?Promise.resolve():new Promise(r=>{img.onload=img.onerror=r}))).then(fire);else fire();
  window.addEventListener('afterprint',()=>{try{localStorage.removeItem(key)}catch(_){}setTimeout(()=>{try{window.close()}catch(_){}if(!window.closed){document.getElementById('printStage').style.display='none';document.getElementById('fallback').style.display='block'}},120)},{once:true});
})();
</script>
</body>
</html>
