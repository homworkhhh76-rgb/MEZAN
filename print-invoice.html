<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>طباعة الفاتورة</title>
<style>
@page{margin:0}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:#000}
body{font-family:Arial,Tahoma,sans-serif}
.receipt{margin:0 auto;padding:5mm 2mm;font-size:13px;line-height:1.4;direction:rtl;background:#fff}
.receipt.size-80{width:76mm}.receipt.size-58{width:54mm;font-size:11px;padding:3mm 1.5mm}.receipt.size-a4{width:190mm;padding:10mm;font-size:14px}
table{width:100%;border-collapse:collapse}td,th{padding:3px}.r{text-align:right}.l{text-align:left}
.receipt-logo{text-align:center;margin:0 0 6px}.receipt-logo img{display:block;margin:0 auto;object-fit:contain}.receipt-logo-small img{max-width:28mm;max-height:18mm}.receipt-logo-medium img{max-width:36mm;max-height:24mm}.receipt-logo-large img{max-width:46mm;max-height:31mm}
.receipt-header-table{font-weight:bold;margin-bottom:8px}.receipt-header-table td{vertical-align:top}
.receipt-bordered th,.receipt-bordered td{border:1.5px solid #000;text-align:center;font-weight:bold}
.receipt-totals{margin-top:5px;font-weight:bold;font-size:13px}.size-58 .receipt-totals{font-size:11px}
.receipt-net{margin-top:8px}.receipt-net td{padding:8px 4px;font-size:20px}.receipt-net td:last-child{font-size:22px}.size-58 .receipt-net td{font-size:15px}.size-58 .receipt-net td:last-child{font-size:17px}
.receipt-barcode{text-align:center;margin:8px auto 2px;overflow:hidden}.receipt-barcode svg{max-width:100%;height:auto}.receipt-barcode-small{max-width:65%}.receipt-barcode-medium{max-width:82%}.receipt-barcode-large{max-width:100%}
.receipt-footer-text{text-align:center;font-weight:bold;font-size:15px;margin:10px 0;white-space:pre-wrap}.size-58 .receipt-footer-text{font-size:12px}
.receipt-footer-info{font-size:12px;direction:ltr;margin-top:5px}.size-58 .receipt-footer-info{font-size:10px}
.print-fallback{display:none;text-align:center;padding:14px;font-family:Tahoma,Arial,sans-serif}.print-fallback button{padding:10px 18px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:15px}
@media print{.print-fallback{display:none!important}}
</style>
</head>
<body>
<main id="receipt" class="receipt size-80"></main>
<div id="fallback" class="print-fallback"><p>تم تجهيز الفاتورة.</p><button onclick="window.print()">فتح الطباعة مرة أخرى</button></div>
<script>
(()=>{
  const p=new URLSearchParams(location.search),token=p.get('token')||'',key='almezan_print_job_v758_'+token;
  let job=null;try{job=JSON.parse(localStorage.getItem(key)||'null')}catch(_){}
  const root=document.getElementById('receipt');
  if(!job){root.innerHTML='<p style="text-align:center;padding:20px">تعذر العثور على بيانات الفاتورة.</p>';return}
  root.className='receipt size-'+(job.size==='58'?'58':job.size==='a4'?'a4':'80');root.innerHTML=job.html||'';document.title=job.number?('فاتورة '+job.number):'طباعة الفاتورة';
  let fired=false;const fire=()=>{if(fired)return;fired=true;requestAnimationFrame(()=>setTimeout(()=>{try{window.print()}catch(_){}},120))};
  const imgs=[...document.images];if(imgs.length)Promise.allSettled(imgs.map(img=>img.complete?Promise.resolve():new Promise(r=>{img.onload=img.onerror=r}))).then(fire);else fire();
  window.addEventListener('afterprint',()=>{try{localStorage.removeItem(key)}catch(_){}setTimeout(()=>{try{window.close()}catch(_){}if(!window.closed)document.getElementById('fallback').style.display='block'},120)},{once:true});
})();
</script>
</body>
</html>
